[project]
name = "houston"
version = "0.1.0"
description = "Houston backend — built on the inlined snacks platform."
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
  # framework + ORM
  "litestar[standard,sqlalchemy]",
  "sqlalchemy",
  "advanced-alchemy",
  "msgspec",
  "greenlet",
  "psycopg[binary]",
  "uvicorn",
  "python-dotenv",
  # ids
  "sqids>=0.5.0",
  # tenancy / RLS machinery (alembic ops + comparator + PGPolicy registry)
  "alembic",
  "alembic-utils",
  # events + queue mechanism
  "litestar-saq>=0.1.6",
  "saq>=0.25.2",
  "redis>=5.0",
  # documents: PDF rendering
  "weasyprint>=62.0",
  "jinja2>=3.1.0",
  # embeddings
  "pgvector>=0.3.0",
  # inlined service impls (llm / media / billing / comms) import these at module scope
  "anthropic>=0.40.0",
  "openai>=1.50.0",
  "aioboto3>=13.0.0",
  "boto3>=1.35",
  "Pillow>=10.0",
  "email-validator>=2.0",
  "stripe>=10.0",
]

[dependency-groups]
dev = [
  "basedpyright>=1.23",
  "ruff>=0.9",
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "polyfactory>=3.3.0",
  "faker>=30.0",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "PLC"]

[tool.ruff.lint.per-file-ignores]
"app/config.py"          = ["N802"]
"app/platform/**/config.py" = ["N802"]
"alembic/env.py"         = ["E402"]
"alembic/versions/*.py"  = ["E501", "W291", "UP035"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
combine-as-imports = true

[tool.basedpyright]
typeCheckingMode = "basic"
ignore = ["alembic/versions"]
reportIncompatibleMethodOverride = "error"
reportGeneralTypeIssues = "warning"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
